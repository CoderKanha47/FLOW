services:
  postgres:
    image: postgres:16-alpine
    container_name: flow-postgres
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: flow-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://flow:flow@postgres:5432/flow
      SECRET_KEY: change-me-in-production
      SECRET_ENCRYPTION_KEY: mUiG1budkRLo6fHV1kahSXuy6srno1Uf4hzL_a7OxtI=
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: flow-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
